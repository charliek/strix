# The toolchain is pinned in rust-toolchain.toml; let cargo pick dependency
# versions that actually support it: prefer rust-version-compatible releases,
# falling back to newer ones only when nothing else satisfies the graph.
# Without this, the edition-2021 (v2) resolver grabs the latest transitive
# crates regardless of the rustc they require.
[resolver]
incompatible-rust-versions = "fallback"
